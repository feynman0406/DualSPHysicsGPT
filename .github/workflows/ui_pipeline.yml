name: UI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - "experiment-*"
  pull_request:
    paths:
      - "ui/**"
      - "ui_backend/**"
      - "docs/ui_integration/**"
      - "scripts/ci/**"
      - "tests/ui_backend/**"
      - ".github/workflows/ui_pipeline.yml"
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}
      OPENAI_RAG_VS_DESIGN_ID: ${{ secrets.OPENAI_RAG_VS_DESIGN_ID || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/app/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ui/app

      - name: Run full UI pipeline
        if: env.OPENAI_API_KEY != '' && env.OPENAI_RAG_VS_DESIGN_ID != ''
        run: python scripts/ci/run_all.py

      - name: Run UI pipeline (skip MVP smoke)
        if: env.OPENAI_API_KEY == '' || env.OPENAI_RAG_VS_DESIGN_ID == ''
        run: python scripts/ci/run_all.py --skip-mvp
